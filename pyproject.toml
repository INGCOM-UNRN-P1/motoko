[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motoko"
version = "0.1.0"
description = "Verificador de encapsulamiento estricto y opacidad de Tipos Abstractos de Datos (TDAs) en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.24.0,<0.25.0",
    "tree-sitter-c>=0.23.2,<0.24.0",
]

[project.scripts]
motoko = "motoko.cli:app"

[project.entry-points."ripley.plugins"]
tda_encapsulation = "motoko.plugins.ripley_plugin:MotokoPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
